name: Build Android Test APK
run-name: Android test APK ${{ inputs.test_number }} - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      test_number:
        description: 'Test build number within this version (3 makes 5.1.9.3)'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PICA_TEST_BUILD: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || { echo "Unexpected version: $version"; exit 1; }
          echo "APP_VERSION=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${version##*+}" >> "$GITHUB_ENV"
      - name: Read test build number
        env:
          TEST_NUMBER: ${{ inputs.test_number }}
        run: |
          [[ "$TEST_NUMBER" =~ ^[1-9][0-9]?$ ]] || { echo "Test number must be 1-99, got: $TEST_NUMBER"; exit 1; }
          echo "PICA_TEST_NUMBER=$TEST_NUMBER" >> "$GITHUB_ENV"
          echo "TEST_VERSION=$APP_VERSION.$TEST_NUMBER" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Configure fixed test signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, pathlib, base64
          os.umask(0o077)
          encoded = os.environ['KEYSTORE_BASE64']
          password = os.environ['KEYSTORE_PASSWORD']
          if not encoded or not password:
              # Forks without the secrets still build, with a throwaway key.
              print('::warning::No test signing key; this build cannot install over an earlier test build.')
              raise SystemExit
          keystore = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pica-test.p12'
          with keystore.open('xb') as f:
              f.write(base64.b64decode(encoded, validate=True))
          with pathlib.Path('android/test-key.properties').open('x') as f:
              f.write(f'storeFile={keystore}\nstoreType=PKCS12\nkeyAlias=pica-test\nstorePassword={password}\nkeyPassword={password}\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('PICA_TEST_SIGNING=fixed\n')
          PY
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Tests
        run: flutter test --no-pub
      - name: Build release-mode test APK
        run: flutter build apk --release --no-pub --target-platform android-arm64,android-x64 --dart-define=PICA_TEST_NUMBER=$PICA_TEST_NUMBER
      - name: Verify and package APK
        shell: bash
        run: |
          mkdir -p dist
          apk="PicaComic-$TEST_VERSION-test.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          signature=$("$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --verbose --print-certs "dist/$apk")
          echo "$signature"
          if [[ "$PICA_TEST_SIGNING" == fixed ]]; then
            # Every test build is signed by this certificate, so a newer test
            # build of the same version installs over the older one.
            expected_cert=b0c88322130e114c4ed2cce5533c2eb9e87c7ecaddd0b43025bcae3cfdcf22c5
            digests=$(grep -E 'certificate SHA-256 digest:' <<< "$signature" | sed -E 's/.*digest: //; s/://g' | tr 'A-F' 'a-f' | sort -u)
            [[ "$digests" == "$expected_cert" ]] || { echo "Unexpected signing certificate: $digests"; exit 1; }
          fi
          badging=$("$ANDROID_HOME/build-tools/$build_tools/aapt" dump badging "dist/$apk")
          echo "$badging"
          # The test app must install next to the released one, never over it.
          # Later test builds of a version install over earlier ones.
          expected="package: name='com.github.pacalini.pica_comic.test519' versionCode='$((APP_BUILD * 100 + PICA_TEST_NUMBER))' versionName='$TEST_VERSION'"
          grep -qF "$expected" <<< "$badging" || { echo "Unexpected package/version, wanted: $expected"; exit 1; }
          cd dist
          sha256sum "$apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PicaComic-${{ env.TEST_VERSION }}-test-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
