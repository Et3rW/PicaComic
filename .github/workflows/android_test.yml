name: Build Android Test APK
run-name: Android test APK - ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PICA_TEST_BUILD: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || { echo "Unexpected version: $version"; exit 1; }
          echo "APP_VERSION=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${version##*+}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Tests
        run: flutter test --no-pub
      - name: Build release-mode test APK
        run: flutter build apk --release --no-pub --target-platform android-arm64,android-x64
      - name: Verify and package APK
        shell: bash
        run: |
          mkdir -p dist
          apk="PicaComic-$APP_VERSION-test.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "dist/$apk"
          build_tools=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$build_tools/apksigner" verify --verbose "dist/$apk"
          badging=$("$ANDROID_HOME/build-tools/$build_tools/aapt" dump badging "dist/$apk")
          echo "$badging"
          # The test app must install next to the released one, never over it.
          expected="package: name='com.github.pacalini.pica_comic.test${APP_VERSION//./}' versionCode='$APP_BUILD' versionName='$APP_VERSION'"
          grep -qF "$expected" <<< "$badging" || { echo "Unexpected package/version, wanted: $expected"; exit 1; }
          cd dist
          sha256sum "$apk" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PicaComic-${{ env.APP_VERSION }}-test-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
