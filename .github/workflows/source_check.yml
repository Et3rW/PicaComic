name: Check comic sources
run-name: Weekly source check

# Runs the built-in sources against the real sites, so a site change shows up
# here before it shows up in the app. A failed run means a site answered but
# could not be understood; sites that block GitHub's servers are listed as
# skipped in the run summary.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check sources against the real sites
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded test_live 2>&1 | tee live.log
      - name: Summary
        if: always()
        run: |
          {
            echo '### Source check'
            echo
            echo '```'
            grep -E '^[0-9:]+ \+[0-9]+.*: (e-hentai|wnacg|hitomi|jm|nhentai|picacg)( \[E\])?$|could not be reached|tests passed|tests failed' live.log | sed 's/\x1b\[[0-9;]*m//g' | awk '!seen[$0]++' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
