name: Build Android Release APK
run-name: Android release APK - ${{ github.sha }}

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PICA_RELEASE_BUILD: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] || { echo "Unexpected version: $version"; exit 1; }
          echo "APP_VERSION=${version%%+*}" >> "$GITHUB_ENV"
          echo "APP_BUILD=${version##*+}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Configure persistent release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, pathlib, base64
          os.umask(0o077)
          encoded = os.environ['KEYSTORE_BASE64']
          password = os.environ['KEYSTORE_PASSWORD']
          if not encoded or not password:
              raise RuntimeError('Persistent release signing secrets are missing')
          keystore = pathlib.Path(os.environ['RUNNER_TEMP']) / 'pica-release.p12'
          with keystore.open('xb') as f:
              f.write(base64.b64decode(encoded, validate=True))
          with pathlib.Path('android/key.properties').open('x') as f:
              f.write(f'storeFile={keystore}\nstoreType=PKCS12\nkeyAlias=pica-release\nstorePassword={password}\nkeyPassword={password}\n')
          PY
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Tests
        run: flutter test --no-pub
      - name: Build release APK
        run: flutter build apk --release --no-pub --target-platform android-arm64,android-x64
      - name: Verify and package APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/PicaComic-$APP_VERSION.apk"
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          tools = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools'
          versions = [p for p in tools.iterdir() if re.fullmatch(r'\d+\.\d+\.\d+', p.name)]
          sdk = max(versions, key=lambda p: tuple(map(int, p.name.split('.'))))
          version, build = os.environ['APP_VERSION'], os.environ['APP_BUILD']
          apk = f'dist/PicaComic-{version}.apk'
          signature = subprocess.check_output([str(sdk/'apksigner'), 'verify', '--verbose', '--print-certs', apk], text=True)
          print(signature, flush=True)
          expected = 'd7d2aa05487ac22f2b9ec2147d5629535ed76b50938a412707ab901161b8903b'
          digests = re.findall(r'^(?:Signer #\d+|V\d+(?:\.\d+)? Signer:) certificate SHA-256 digest: ([0-9a-fA-F:]+)\s*$', signature, re.MULTILINE)
          assert {digest.replace(':', '').lower() for digest in digests} == {expected}, 'Unexpected signing certificate'
          info = subprocess.check_output([str(sdk/'aapt'), 'dump', 'badging', apk], text=True)
          assert f"package: name='com.github.et3rw.pica_comic' versionCode='{build}' versionName='{version}'" in info, 'Unexpected package/version'
          print(info.splitlines()[0])
          PY
          cd dist
          sha256sum "PicaComic-$APP_VERSION.apk" > SHA256SUMS-android.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PicaComic-${{ env.APP_VERSION }}-android
          path: dist/
          if-no-files-found: error
          retention-days: 30
